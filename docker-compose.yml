services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-payments}
      POSTGRES_USER: ${DB_USER:-payments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payments}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payments}"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

  payment-service:
    build: ./payment-service
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-payments}
      DB_USER: ${DB_USER:-payments}
      DB_PASSWORD: ${DB_PASSWORD:-payments}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api-gateway:
    build: ./api-gateway
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8081
    ports:
      - "8080:8080"
    depends_on:
      payment-service:
        condition: service_healthy

volumes:
  pgdata:
