server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@apiKeyResolver}"
                    throw-on-limit: true
                    redis-rate-limiter.replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requested-tokens: 1
            - id: payment-service-admin
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/**
            - id: payment-service-docs
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  health:
    redis:
      enabled: false
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,gateway