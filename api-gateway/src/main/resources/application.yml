server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_TIMEOUT:250ms}
      repositories:
        enabled: false
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@apiKeyResolver}"
                    rate-limiter: "#{@apiKeyRateLimiter}"
                    throw-on-limit: true
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    rate-limiter: "#{@clientIpRateLimiter}"
                    throw-on-limit: true
            - id: payment-service-admin
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/**
            - id: payment-service-docs
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

rate-limit:
  api-key:
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}
  client-ip:
    replenish-rate: ${RATE_LIMIT_IP_REPLENISH_RATE:20}
    burst-capacity: ${RATE_LIMIT_IP_BURST_CAPACITY:40}

logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit.RedisRateLimiter: "OFF"

management:
  health:
    redis:
      enabled: false
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,gateway