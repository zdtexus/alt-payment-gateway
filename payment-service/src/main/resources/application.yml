server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": ${MAIL_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_TIMEOUT_MS:5000}

admin:
  api-key: ${ADMIN_API_KEY:}

payment:
  provider:
    default-provider: ${PAYMENT_PROVIDER_DEFAULT:simulated}
    simulated:
      success-rate: ${PAYMENT_PROVIDER_SUCCESS_RATE:0.9}
      latency: ${PAYMENT_PROVIDER_LATENCY:300ms}
    fixed:
      outcome: ${PAYMENT_PROVIDER_FIXED_OUTCOME:approve}
      decline-reason: ${PAYMENT_PROVIDER_FIXED_DECLINE_REASON:Declined by fixed provider}
    http:
      api-key: ${PAYMENT_PROVIDER_HTTP_API_KEY:}
      connect-timeout: ${PAYMENT_PROVIDER_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${PAYMENT_PROVIDER_HTTP_READ_TIMEOUT:10s}

notification:
  email:
    from: no-reply@alt-payment.local
  sms:
    provider: ${SMS_PROVIDER:log}

springdoc:
  default-produces-media-type: application/json

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info