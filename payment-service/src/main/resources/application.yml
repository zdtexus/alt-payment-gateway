server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

payment:
  provider:
    success-rate: ${PAYMENT_PROVIDER_SUCCESS_RATE:0.9}
    latency: ${PAYMENT_PROVIDER_LATENCY:300ms}

notification:
  email:
    from: no-reply@alt-payment.local
  sms:
    provider: ${SMS_PROVIDER:log}

management:
  endpoints:
    web:
      exposure:
        include: health,info